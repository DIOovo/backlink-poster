<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="cache.title">AI Form Filler — Cache Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #4f46e5; --accent-light: #eef2ff; --accent-dark: #3730a3;
      --success: #16a34a; --error: #dc2626;
      --bg: #f3f4f6; --surface: #ffffff; --border: #e5e7eb; --text: #111827; --muted: #6b7280;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; color: var(--text); background: var(--bg); height: 100vh; display: flex; flex-direction: column; }
    .topbar { padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .topbar h1 { font-size: 18px; font-weight: 700; color: var(--accent); flex: 1; }
    .count { font-size: 12px; color: var(--muted); }
    .layout { flex: 1; display: flex; min-height: 0; }
    .list {
      width: 300px; flex-shrink: 0; border-right: 1px solid var(--border);
      background: var(--surface); overflow-y: auto;
    }
    .list-empty { padding: 20px; color: var(--muted); font-size: 13px; }
    .item {
      padding: 11px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
    }
    .item:hover { background: var(--accent-light); }
    .item.active { background: var(--accent-light); border-left: 3px solid var(--accent); padding-left: 13px; }
    .item-name { font-weight: 600; font-size: 13px; margin-bottom: 3px; }
    .item-url { font-size: 11px; color: var(--muted); font-family: monospace; word-break: break-all; }
    .item-meta { font-size: 10px; color: var(--muted); margin-top: 3px; }

    .detail { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .detail-head { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 12px; }
    .detail-head .title { flex: 1; }
    .detail-head .title h2 { font-size: 16px; font-weight: 600; }
    .detail-head .title .sub { font-size: 12px; color: var(--muted); font-family: monospace; margin-top: 2px; word-break: break-all; }
    .btn-del { background: #fef2f2; color: var(--error); border: 1px solid #fecaca; border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .btn-del:hover { background: #fee2e2; }
    .panes { flex: 1; display: flex; min-height: 0; }
    .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .pane:first-child { border-right: 1px solid var(--border); }
    .pane-head { padding: 8px 16px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--border); background: var(--surface); }
    .pane pre { flex: 1; margin: 0; padding: 14px 16px; overflow: auto; font-family: 'Menlo','Monaco',monospace; font-size: 12px; line-height: 1.55; color: #1e293b; white-space: pre-wrap; word-break: break-word; }
    .placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; }
    .detail-head .edits { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .detail-head .edit-row { display: flex; align-items: center; gap: 8px; }
    .detail-head .edit-row label { font-size: 11px; color: var(--muted); width: 64px; flex-shrink: 0; }
    .detail-head input { flex: 1; border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; font-size: 13px; outline: none; }
    .detail-head input:focus { border-color: var(--accent); }
    .detail-head input[readonly] { background: var(--bg); color: var(--muted); font-family: monospace; }
    .detail-actions { display: flex; flex-direction: column; gap: 6px; }
    .btn-save { background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 7px 14px; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .btn-save:hover { background: var(--accent-dark); }
    .pane textarea { flex: 1; margin: 0; padding: 14px 16px; border: 0; outline: none; resize: none; font-family: 'Menlo','Monaco',monospace; font-size: 12px; line-height: 1.55; color: #1e293b; background: #fff; }
    .pane textarea:focus { background: #fcfcff; }
    .save-msg { font-size: 12px; padding: 0 20px 8px; }
    .save-msg.ok { color: var(--success); }
    .save-msg.err { color: var(--error); }
  </style>
</head>
<body>
  <div class="topbar">
    <h1 data-i18n="cache.heading">✦ Form Cache Manager</h1>
    <span class="count" id="count"></span>
  </div>
  <div class="layout">
    <div class="list" id="list"></div>
    <div class="detail" id="detail">
      <div class="placeholder" id="placeholder" data-i18n="cache.placeholder">← Select a cache entry on the left to view the fields JSON and code</div>
    </div>
  </div>
  <script type="module" src="/src/cache.ts"></script>
</body>
</html>
